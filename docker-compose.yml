services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forreira
      POSTGRES_PASSWORD: forreira
      POSTGRES_DB: forreira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forreira"]
      interval: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://forreira:forreira@db:5432/forreira
      # Demo values: change JWT_SECRET and ADMIN_PASSWORD before exposing this anywhere public.
      JWT_SECRET: demo-secret-change-me-before-production
      ADMIN_EMAIL: admin@forreira.com
      ADMIN_PASSWORD: ChangeMe123!
      DB_SYNCHRONIZE: "true"
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  pgdata:
