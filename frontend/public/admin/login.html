<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title data-i18n="adminLogin.title">فوريرة | دخول الإدارة</title>
  <!-- Favicon / أيقونة الموقع في التاب -->
  <link rel="icon" type="image/svg+xml" href="/assets/img/forreira-logo.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/img/forreira-logo.svg">
  <!-- Theme & Lang Early Initializers to prevent flashing -->
  <script src="/assets/js/theme-init.js"></script>
  <script src="/assets/js/lang-init.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind.config.js"></script>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    html[lang="en"] body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-cardBg dark:bg-darkBg min-h-screen text-darkText dark:text-darkTextMain flex flex-col items-center justify-center p-4 transition-colors">
  
  <!-- Header Controls Bar -->
  <header class="w-full max-w-md flex justify-end items-center gap-2 mb-4">
    <!-- Theme Toggle -->
    <button type="button" data-action="toggle-theme" aria-label="تبديل المظهر" aria-pressed="false" class="w-10 h-10 flex items-center justify-center rounded-xl border border-gray-200 dark:border-darkBorder bg-white dark:bg-darkCard text-gray-700 dark:text-darkTextMain hover:border-primary dark:hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition cursor-pointer">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
    <!-- Language Toggle -->
    <button type="button" data-action="toggle-lang" aria-label="تبديل اللغة إلى الإنجليزية" class="px-3.5 h-10 text-xs font-bold flex items-center justify-center rounded-xl border border-gray-200 dark:border-darkBorder bg-white dark:bg-darkCard text-gray-700 dark:text-darkTextMain hover:border-primary dark:hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition cursor-pointer">
      EN
    </button>
  </header>

  <main class="w-full max-w-md bg-white dark:bg-darkCard rounded-3xl shadow-xl border border-gray-200 dark:border-darkBorder p-8 transition-colors">
    <div class="h-16 flex items-center justify-center mb-6">
      <img src="/assets/img/forreira-logo.svg" alt="فوريرة" data-i18n-aria-label="brand.logoAlt" class="h-16 w-auto object-contain dark:hidden">
      <img src="/assets/img/forreira-logo-light.svg" alt="فوريرة" data-i18n-aria-label="brand.logoAlt" class="h-16 w-auto object-contain hidden dark:block">
    </div>
    <h1 data-i18n="adminLogin.heading" class="text-2xl font-black text-center mb-6 text-darkText dark:text-darkTextMain">دخول الإدارة</h1>
    <form id="loginForm" class="space-y-4">
      <label class="block text-sm font-bold text-darkText dark:text-darkTextMain">
        <span data-i18n="adminLogin.email">البريد الإلكتروني</span>
        <input name="email" type="email" required autocomplete="username" class="mt-1 w-full bg-white dark:bg-darkBg border border-gray-300 dark:border-darkBorder text-darkText dark:text-darkTextMain placeholder-gray-400 dark:placeholder-darkMuted rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary">
      </label>
      <label class="block text-sm font-bold text-darkText dark:text-darkTextMain">
        <span data-i18n="adminLogin.password">كلمة المرور</span>
        <input name="password" type="password" required minlength="8" autocomplete="current-password" class="mt-1 w-full bg-white dark:bg-darkBg border border-gray-300 dark:border-darkBorder text-darkText dark:text-darkTextMain placeholder-gray-400 dark:placeholder-darkMuted rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary">
      </label>
      <button type="submit" data-i18n="adminLogin.submit" class="w-full bg-primary hover:bg-orange-600 text-white font-black py-3 rounded-xl transition shadow-md disabled:opacity-60 cursor-pointer">تسجيل الدخول</button>
    </form>
    <div id="loginResult" class="hidden"></div>
  </main>
  <script type="module" src="/assets/js/admin-login.js"></script>
</body>
</html>
